<div class="app">
  <header class="topbar">
    <h1 class="title">数独</h1>
    <div class="actions">
      <button id="btn-reset" class="btn" type="button">重置本局</button>
    </div>
  </header>

  <main class="play">
    <div id="board" class="board" role="grid" aria-label="数独棋盘"></div>
    <div id="pad" class="pad" role="group" aria-label="数字盘"></div>
  </main>

  <p class="hint">
    点格或方向键选中，数字键 / 数字盘填数，Backspace 擦除。<br>
    Given 格不可改；与同行、同列、同宫重复会即时标红（不阻断）。填满且无冲突即胜利。
  </p>
</div>

<div id="win" class="win-overlay" hidden>
  <div class="win-card">
    <h2>完成 🎉</h2>
    <p id="win-text">棋盘已填满且无冲突。</p>
    <button id="btn-win-reset" class="btn" type="button">再来一局</button>
  </div>
</div>
