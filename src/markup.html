<div class="app">
  <header class="topbar">
    <h1 class="title">数独</h1>
    <div class="actions">
      <label class="diff">
        难度
        <select id="difficulty" class="select" aria-label="难度选择">
          <option value="easy">简单</option>
          <option value="medium" selected>中等</option>
          <option value="hard">困难</option>
          <option value="expert">专家</option>
        </select>
      </label>
      <span id="timer" class="timer" aria-live="off">00:00</span>
      <button id="btn-new" class="btn" type="button">新局</button>
      <button id="btn-reset" class="btn btn-ghost" type="button">重置</button>
      <button id="btn-theme" class="btn btn-ghost" type="button" aria-label="切换主题">主题</button>
    </div>
  </header>

  <p id="status" class="status" aria-live="polite">生成中…</p>

  <main class="play">
    <div id="board" class="board" role="grid" aria-label="数独棋盘"></div>

    <div id="hint-bar" class="hint-bar" hidden aria-live="polite"></div>

    <div class="toolbar" role="group" aria-label="对局工具">
      <button id="btn-note" class="btn btn-toggle" type="button" aria-pressed="false">笔记</button>
      <button id="btn-autonote" class="btn btn-ghost" type="button">自动候选</button>
      <button id="btn-undo" class="btn btn-ghost" type="button">撤销</button>
      <button id="btn-redo" class="btn btn-ghost" type="button">重做</button>
      <button id="btn-hint" class="btn btn-ghost" type="button">提示</button>
      <button id="btn-pause" class="btn btn-ghost" type="button">暂停</button>
    </div>

    <div id="pad" class="pad" role="group" aria-label="数字盘"></div>
  </main>

  <p class="hint">
    点格或方向键选中，数字键 / 数字盘填数，Backspace 擦除。<br>
    笔记模式（N）下数字键标记候选；给定格不可改；与同行、同列、同宫重复会即时标红（不阻断）。<br>
    撤销 Ctrl/⌘+Z，重做 Ctrl/⌘+Shift+Z，提示 H，暂停 P。
  </p>
</div>

<div id="win" class="win-overlay" hidden>
  <div class="win-card" id="win-card">
    <h2>完成 🎉</h2>
    <p id="win-text">棋盘已填满且唯一解正确。</p>
    <p id="win-best" class="win-best"></p>
    <button id="btn-win-reset" class="btn" type="button">再来一局</button>
  </div>
</div>

<div id="generating" class="gen-overlay" hidden>
  <div class="gen-card">生成中…</div>
</div>

<div id="pause" class="gen-overlay" hidden>
  <div class="gen-card">
    <div class="pause-title">已暂停</div>
    <button id="btn-resume" class="btn" type="button">继续</button>
  </div>
</div>

<div id="resume" class="gen-overlay" hidden>
  <div class="gen-card">
    <div class="resume-title">发现进行中的对局</div>
    <p id="resume-info" class="resume-info"></p>
    <div class="resume-actions">
      <button id="btn-resume-keep" class="btn" type="button">继续上一局</button>
      <button id="btn-resume-new" class="btn btn-ghost" type="button">开新局</button>
    </div>
  </div>
</div>
