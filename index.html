<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数独</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5fb;
  --panel: #ffffff;
  --panel-2: #eef0f7;
  --line: #cfd3e0;
  --line-strong: #8a90a6;
  --text: #1c2030;
  --muted: #6b7180;
  --accent: #5b6cff;
  --accent-weak: #e7eaff;
  --given: #1c2030;
  --conflict: #e5484d;
  --peer-bg: #eef1f8;
  --same-bg: #dfe6ff;
  --selected-bg: #c9d2ff;
  --shadow: 0 6px 24px rgba(20, 24, 48, 0.10);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1f2330;
    --line: #2c3140;
    --line-strong: #4b5266;
    --text: #e6e8ef;
    --muted: #9aa0b0;
    --accent: #7c8cff;
    --accent-weak: #232a44;
    --given: #e6e8ef;
    --conflict: #ff6b6f;
    --peer-bg: #1d2230;
    --same-bg: #2a3354;
    --selected-bg: #36406b;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px 12px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.title { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.diff {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}
.select {
  appearance: none;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--text);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 14px;
  cursor: pointer;
}

.btn {
  appearance: none;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
}
.btn:hover { background: var(--panel-2); }
.btn:active { transform: translateY(1px); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--muted); }

.status {
  margin: 0;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  min-height: 18px;
}

.gen-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 20, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}
.gen-overlay[hidden] { display: none; }
.gen-card {
  background: var(--panel);
  color: var(--text);
  border-radius: 14px;
  padding: 18px 28px;
  font-size: 15px;
  box-shadow: var(--shadow);
}

.board {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: min(92vw, calc(92vh - 200px), 560px);
  aspect-ratio: 1 / 1;
  margin: 0 auto;
  background: var(--panel);
  border: 2px solid var(--line-strong);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
  user-select: none;
}

.cell {
  appearance: none;
  margin: 0;
  border: 1px solid var(--line);
  border-top: none;
  border-left: none;
  background: var(--panel);
  color: var(--text);
  font-size: clamp(16px, 4.4vw, 30px);
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  transition: background 0.12s ease, color 0.12s ease;
  font-variant-numeric: tabular-nums;
}
.cell.br { border-right: 2px solid var(--line-strong); }
.cell.bb { border-bottom: 2px solid var(--line-strong); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 2; }

.cell.given { font-weight: 700; color: var(--given); }
.cell.user { color: var(--accent); }

.cell.peer { background: var(--peer-bg); }
.cell.same { background: var(--same-bg); }
.cell.selected { background: var(--selected-bg); }

.cell.conflict { color: var(--conflict); }
.cell.conflict.selected { color: var(--conflict); }

.pad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  width: min(92vw, calc(92vh - 200px), 560px);
  margin: 0 auto;
}
.pad-num {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  border-radius: 12px;
  padding: 12px 0;
  font-size: clamp(16px, 4.4vw, 24px);
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s ease, transform 0.05s ease;
  min-height: 44px;
}
.pad-num:hover { background: var(--panel-2); }
.pad-num:active { transform: translateY(1px); }
.pad-erase { color: var(--muted); }

.hint {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.win-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 20, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.win-overlay[hidden] { display: none; }
.win-card {
  background: var(--panel);
  color: var(--text);
  border-radius: 16px;
  padding: 28px 32px;
  text-align: center;
  box-shadow: var(--shadow);
  max-width: 320px;
}
.win-card h2 { margin: 0 0 8px; font-size: 24px; }
.win-card p { margin: 0 0 18px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .cell, .btn, .pad-num { transition: none; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="title">数独</h1>
    <div class="actions">
      <label class="diff">
        难度
        <select id="difficulty" class="select" aria-label="难度选择">
          <option value="easy">简单</option>
          <option value="medium" selected>中等</option>
          <option value="hard">困难</option>
          <option value="expert">专家</option>
        </select>
      </label>
      <button id="btn-new" class="btn" type="button">新局</button>
      <button id="btn-reset" class="btn btn-ghost" type="button">重置</button>
    </div>
  </header>

  <p id="status" class="status" aria-live="polite">生成中…</p>

  <main class="play">
    <div id="board" class="board" role="grid" aria-label="数独棋盘"></div>
    <div id="pad" class="pad" role="group" aria-label="数字盘"></div>
  </main>

  <p class="hint">
    点格或方向键选中，数字键 / 数字盘填数，Backspace 擦除。<br>
    Given 格不可改；与同行、同列、同宫重复会即时标红（不阻断）。填满唯一解即胜利。
  </p>
</div>

<div id="win" class="win-overlay" hidden>
  <div class="win-card">
    <h2>完成 🎉</h2>
    <p id="win-text">棋盘已填满且唯一解正确。</p>
    <button id="btn-win-reset" class="btn" type="button">再来一局</button>
  </div>
</div>

<div id="generating" class="gen-overlay" hidden>
  <div class="gen-card">生成中…</div>
</div>

<script>
'use strict';
/**
 * Sudoku 纯逻辑层（无 DOM、无副作用，可在 node 下被测试）。
 * 同时以 UMD 形式暴露：浏览器挂到 window.SudokuLogic，node 下 module.exports。
 * 该文件会被 build.js 内联进最终单文件 index.html。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SudokuLogic = api;
})(typeof self !== 'undefined' ? self : this, function () {
  const N = 9;
  const CELLS = 81;

  // ---- 索引与坐标 ----
  function idx(r, c) { return r * 9 + c; }
  function rowOf(i) { return (i / 9) | 0; }
  function colOf(i) { return i % 9; }
  function boxOf(i) {
    const r = rowOf(i), c = colOf(i);
    return ((r / 3) | 0) * 3 + ((c / 3) | 0);
  }

  // ---- 预计算 peers / units ----
  // PEERS[i]: 与 i 同行/列/宫的 20 个邻居（不含自身）
  const PEERS = new Array(CELLS);
  for (let i = 0; i < CELLS; i++) {
    const r = rowOf(i), c = colOf(i), b = boxOf(i);
    const set = new Set();
    for (let k = 0; k < 9; k++) { set.add(idx(r, k)); set.add(idx(k, c)); }
    const br = ((b / 3) | 0) * 3, bc = (b % 3) * 3;
    for (let dr = 0; dr < 3; dr++)
      for (let dc = 0; dc < 3; dc++) set.add(idx(br + dr, bc + dc));
    set.delete(i);
    PEERS[i] = Array.from(set);
  }

  // UNITS: 27 个单元（9 行 + 9 列 + 9 宫），每个 9 个索引
  const UNITS = [];
  for (let r = 0; r < 9; r++) { const u = []; for (let c = 0; c < 9; c++) u.push(idx(r, c)); UNITS.push(u); }
  for (let c = 0; c < 9; c++) { const u = []; for (let r = 0; r < 9; r++) u.push(idx(r, c)); UNITS.push(u); }
  for (let b = 0; b < 9; b++) { const u = []; const br = ((b/3)|0)*3, bc = (b%3)*3; for (let dr=0;dr<3;dr++) for (let dc=0;dc<3;dc++) u.push(idx(br+dr, bc+dc)); UNITS.push(u); }

  // ---- 位掩码（数字 d 对应 1<<(d-1)）----
  function bit(d) { return 1 << (d - 1); }
  function digitsToMask(digits) {
    let m = 0;
    for (const d of digits) if (d >= 1 && d <= 9) m |= bit(d);
    return m;
  }
  function maskToDigits(mask) {
    const out = [];
    for (let d = 1; d <= 9; d++) if (mask & bit(d)) out.push(d);
    return out;
  }

  // ---- 冲突检测 ----
  // 返回 Set<index>：与某 peer 同值（同行/列/宫重复）的所有格子。空盘返回空集。
  function findConflicts(values) {
    const conflicts = new Set();
    for (let i = 0; i < CELLS; i++) {
      const v = values[i];
      if (v === 0) continue;
      const peers = PEERS[i];
      for (let k = 0; k < peers.length; k++) {
        if (values[peers[k]] === v) { conflicts.add(i); conflicts.add(peers[k]); break; }
      }
    }
    return conflicts;
  }

  // ---- 完成 / 胜利 ----
  function isComplete(values) {
    for (let i = 0; i < CELLS; i++) if (values[i] === 0) return false;
    return true;
  }
  // 胜利：81 格填满且无冲突（唯一解前提下即正确解）
  function isSolved(values) {
    return isComplete(values) && findConflicts(values).size === 0;
  }

  function cloneValues(values) { return values.slice(); }

  // ---- 选中移动（方向键，边界 clamp）----
  function moveSelection(sel, dir) {
    if (!sel) return sel;
    let r = sel.r, c = sel.c;
    switch (dir) {
      case 'up':    r = Math.max(0, r - 1); break;
      case 'down':  r = Math.min(8, r + 1); break;
      case 'left':  c = Math.max(0, c - 1); break;
      case 'right': c = Math.min(8, c + 1); break;
      default: return sel;
    }
    return { r, c };
  }

  return {
    N, CELLS, idx, rowOf, colOf, boxOf,
    PEERS, UNITS,
    bit, digitsToMask, maskToDigits,
    findConflicts, isComplete, isSolved, cloneValues, moveSelection,
  };
});

'use strict';
/**
 * 回溯求解器（纯函数，无 DOM、无副作用，可在 node 下被测试）。
 * 依赖 SudokuLogic（node 下 require，浏览器下取 window.SudokuLogic）。
 * 该文件会被 build.js 内联进最终单文件 index.html。
 *
 * 暴露：
 *   solve(values)          -> 返回一组解（数组，0=空）或 null（无解）
 *   countSolutions(values, limit=2) -> 解的数量，数到 limit 即停（仅关心唯一性时用 2）
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = factory(require('./logic.js'));
  } else {
    root.SudokuSolver = factory(root.SudokuLogic);
  }
})(typeof self !== 'undefined' ? self : this, function (Logic) {
  'use strict';

  const N = 81;

  function popcount(m) { let c = 0; while (m) { c += m & 1; m >>>= 1; } return c; }

  // 在 grid（0=空）中，i 格当前能放的数字位掩码（9 位）。
  function candidatesOf(grid, i) {
    let used = 0;
    const peers = Logic.PEERS[i];
    for (let k = 0; k < peers.length; k++) {
      const v = grid[peers[k]];
      if (v !== 0) used |= (1 << (v - 1));
    }
    return (~used) & 0x1FF;
  }

  // 用最小剩余候选（MRV）选空格；返回 {i, mask} 或 null（已填满）；mask=0 表示死路。
  function pickCell(grid) {
    let best = -1, bestMask = 0, bestCount = 10;
    for (let i = 0; i < N; i++) {
      if (grid[i] !== 0) continue;
      const mask = candidatesOf(grid, i);
      const cnt = popcount(mask);
      if (cnt === 0) return { i, mask: 0 };
      if (cnt < bestCount) { bestCount = cnt; best = i; bestMask = mask; if (cnt === 1) break; }
    }
    return best === -1 ? null : { i: best, mask: bestMask };
  }

  // 回溯求解：返回解数组或 null。
  function solve(values) {
    const grid = values.slice();
    function rec() {
      const pick = pickCell(grid);
      if (pick === null) return true;   // 填满即解
      if (pick.mask === 0) return false; // 死路
      const mask = pick.mask;
      for (let d = 1; d <= 9; d++) {
        if (mask & (1 << (d - 1))) {
          grid[pick.i] = d;
          if (rec()) return true;
          grid[pick.i] = 0;
        }
      }
      return false;
    }
    return rec() ? grid : null;
  }

  // 计数解的数量，数到 limit（默认 2）即停。用于唯一性判定。
  function countSolutions(values, limit) {
    if (limit === undefined) limit = 2;
    const grid = values.slice();
    let count = 0;
    function rec() {
      const pick = pickCell(grid);
      if (pick === null) { count++; return; }
      if (pick.mask === 0) return;
      const mask = pick.mask;
      for (let d = 1; d <= 9; d++) {
        if (mask & (1 << (d - 1))) {
          grid[pick.i] = d;
          rec();
          grid[pick.i] = 0;
          if (count >= limit) return;
        }
      }
    }
    rec();
    return count;
  }

  return { solve, countSolutions, _internal: { popcount, candidatesOf } };
});

'use strict';
/**
 * 逻辑技巧分级器（纯函数，无 DOM、无副作用，可在 node 下被测试）。
 * 依赖 SudokuLogic / SudokuSolver。
 * 该文件会被 build.js 内联进最终单文件 index.html。
 *
 * 思路：在玩家/生成盘面（仅 givens）上只使用逻辑技巧推进，记录用到的最高层级；
 * 始终优先应用最低可用层，故最高层是"必需"的，难度标签诚实。
 *
 *   T1 唯一候选（Naked single）
 *   T2 隐藏单（Hidden single）
 *   T3 区块指向/声明（Locked candidates）
 *   T4 数对/三数组（Naked/Hidden pair·triple）
 *   T5 X-Wing
 *
 * grade(puzzle)     -> 用到的最高层级 1..5；无法不猜解开则返回 0（弃题重生成）
 * solveLogically(v) -> { solution, tier } 或 null（需要猜测/卡死）
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = factory(require('./logic.js'), require('./solver.js'));
  } else {
    root.SudokuGrader = factory(root.SudokuLogic, root.SudokuSolver);
  }
})(typeof self !== 'undefined' ? self : this, function (Logic, Solver) {
  'use strict';

  const N = 81;
  const FULL = 0x1FF;

  function popcount(m) { let c = 0; while (m) { c += m & 1; m >>>= 1; } return c; }
  // mask 恰为单比特时返回对应数字（1..9）
  function firstDigit(mask) { return 31 - Math.clz32(mask) + 1; }

  // 由已填值计算每空格的初始候选位掩码。
  function initCandidates(values) {
    const cands = new Array(N).fill(0);
    for (let i = 0; i < N; i++) {
      if (values[i] !== 0) { cands[i] = 0; continue; }
      let used = 0;
      const peers = Logic.PEERS[i];
      for (let k = 0; k < peers.length; k++) {
        const v = values[peers[k]];
        if (v !== 0) used |= (1 << (v - 1));
      }
      cands[i] = (~used) & FULL;
    }
    return cands;
  }

  function combinations(arr, k) {
    const res = [];
    const n = arr.length;
    if (k > n) return res;
    const idx = new Array(k);
    (function rec(start, depth) {
      if (depth === k) { res.push(idx.slice()); return; }
      for (let i = start; i <= n - (k - depth); i++) { idx[depth] = arr[i]; rec(i + 1, depth + 1); }
    })(0, 0);
    return res;
  }

  // 在盘面 s={values,cands} 上跑纯逻辑求解。返回 {solution, tier} 或 null。
  function solveLogically(values) {
    const s = { values: values.slice(), cands: initCandidates(values) };
    let maxTier = 0;

    function place(i, d, tier) {
      s.values[i] = d;
      s.cands[i] = 0;
      if (tier > maxTier) maxTier = tier;
      const bm = 1 << (d - 1);
      const peers = Logic.PEERS[i];
      for (let k = 0; k < peers.length; k++) {
        const p = peers[k];
        if (s.values[p] === 0) s.cands[p] &= ~bm;
      }
    }
    function solved() { for (let i = 0; i < N; i++) if (s.values[i] === 0) return false; return true; }

    // T1：唯一候选
    function tryT1() {
      for (let i = 0; i < N; i++) {
        if (s.values[i] !== 0) continue;
        if (popcount(s.cands[i]) === 1) { place(i, firstDigit(s.cands[i]), 1); return true; }
      }
      return false;
    }
    // T2：隐藏单
    function tryT2() {
      for (let u = 0; u < 27; u++) {
        const unit = Logic.UNITS[u];
        for (let d = 1; d <= 9; d++) {
          const bm = 1 << (d - 1);
          let cnt = 0, last = -1;
          for (let q = 0; q < 9; q++) {
            const i = unit[q];
            if (s.values[i] !== 0) continue;
            if (s.cands[i] & bm) { cnt++; last = i; }
          }
          if (cnt === 1) { place(last, d, 2); return true; }
        }
      }
      return false;
    }
    // T3：区块指向（box→行/列）与声明（行/列→box）
    function tryT3() {
      // Case A：box 内的候选集中在同一行/列 -> 从该行/列其余格消除
      for (let b = 18; b < 27; b++) {
        const box = Logic.UNITS[b];
        for (let d = 1; d <= 9; d++) {
          const bm = 1 << (d - 1);
          const cells = [];
          for (let q = 0; q < 9; q++) { const i = box[q]; if (s.values[i] === 0 && (s.cands[i] & bm)) cells.push(i); }
          if (cells.length < 2) continue;
          const r0 = Logic.rowOf(cells[0]);
          if (cells.every(i => Logic.rowOf(i) === r0)) {
            const row = Logic.UNITS[r0], ex = new Set(cells); let ch = false;
            for (let q = 0; q < 9; q++) { const i = row[q]; if (!ex.has(i) && s.values[i] === 0 && (s.cands[i] & bm)) { s.cands[i] &= ~bm; ch = true; } }
            if (ch) { if (3 > maxTier) maxTier = 3; return true; }
          }
          const c0 = Logic.colOf(cells[0]);
          if (cells.every(i => Logic.colOf(i) === c0)) {
            const col = Logic.UNITS[9 + c0], ex = new Set(cells); let ch = false;
            for (let q = 0; q < 9; q++) { const i = col[q]; if (!ex.has(i) && s.values[i] === 0 && (s.cands[i] & bm)) { s.cands[i] &= ~bm; ch = true; } }
            if (ch) { if (3 > maxTier) maxTier = 3; return true; }
          }
        }
      }
      // Case B：行/列内的候选集中在同一 box -> 从该 box 其余格消除
      for (let u = 0; u < 18; u++) {
        const unit = Logic.UNITS[u];
        for (let d = 1; d <= 9; d++) {
          const bm = 1 << (d - 1);
          const cells = [];
          for (let q = 0; q < 9; q++) { const i = unit[q]; if (s.values[i] === 0 && (s.cands[i] & bm)) cells.push(i); }
          if (cells.length < 2) continue;
          const b0 = Logic.boxOf(cells[0]);
