<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数独</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5fb;
  --panel: #ffffff;
  --panel-2: #eef0f7;
  --line: #cfd3e0;
  --line-strong: #8a90a6;
  --text: #1c2030;
  --muted: #6b7180;
  --accent: #5b6cff;
  --accent-weak: #e7eaff;
  --given: #1c2030;
  --conflict: #e5484d;
  --peer-bg: #eef1f8;
  --same-bg: #dfe6ff;
  --selected-bg: #c9d2ff;
  --shadow: 0 6px 24px rgba(20, 24, 48, 0.10);
  --hint-bg: #fff3bf;
  --hint-target-bg: #ffd43b;
  --hint-border: #f08c00;
  --conflict-weak: #ffe3e3;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1f2330;
    --line: #2c3140;
    --line-strong: #4b5266;
    --text: #e6e8ef;
    --muted: #9aa0b0;
    --accent: #7c8cff;
    --accent-weak: #232a44;
    --given: #e6e8ef;
    --conflict: #ff6b6f;
    --peer-bg: #1d2230;
    --same-bg: #2a3354;
  --selected-bg: #36406b;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  --hint-bg: #3a2f12;
  --hint-target-bg: #6b4f12;
  --hint-border: #f0a000;
  --conflict-weak: #3a1818;
}
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px 12px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.title { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.diff {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}
.select {
  appearance: none;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--text);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 14px;
  cursor: pointer;
}

.btn {
  appearance: none;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
}
.btn:hover { background: var(--panel-2); }
.btn:active { transform: translateY(1px); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--muted); }

.status {
  margin: 0;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  min-height: 18px;
}

.timer {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  background: var(--panel-2);
  border-radius: 10px;
  padding: 6px 10px;
  min-width: 58px;
  text-align: center;
}

.toolbar {
  display: flex;
  gap: 8px;
  width: min(92vw, calc(92vh - 200px), 560px);
  margin: 0 auto;
  align-items: center;
  flex-wrap: wrap;
}
.btn-toggle[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.pause-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 12px;
}

.gen-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 20, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}
.gen-overlay[hidden] { display: none; }
.gen-card {
  background: var(--panel);
  color: var(--text);
  border-radius: 14px;
  padding: 18px 28px;
  font-size: 15px;
  box-shadow: var(--shadow);
}
.resume-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.resume-info { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
.resume-actions { display: flex; gap: 10px; justify-content: center; }

.board {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: min(92vw, calc(92vh - 200px), 560px);
  aspect-ratio: 1 / 1;
  margin: 0 auto;
  background: var(--panel);
  border: 2px solid var(--line-strong);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
  user-select: none;
}

.cell {
  appearance: none;
  margin: 0;
  border: 1px solid var(--line);
  border-top: none;
  border-left: none;
  background: var(--panel);
  color: var(--text);
  font-size: clamp(16px, 4.4vw, 30px);
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  transition: background 0.12s ease, color 0.12s ease;
  font-variant-numeric: tabular-nums;
}
.cell.br { border-right: 2px solid var(--line-strong); }
.cell.bb { border-bottom: 2px solid var(--line-strong); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 2; }

.cell.given { font-weight: 700; color: var(--given); }
.cell.user { color: var(--accent); }

.cell.peer { background: var(--peer-bg); }
.cell.same { background: var(--same-bg); }
.cell.selected { background: var(--selected-bg); }

.cell.conflict { color: var(--conflict); }
.cell.conflict.selected { color: var(--conflict); }

/* 候选数（笔记）小数字 3×3 网格 */
.cell .notes-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.cell .notes-grid i {
  font-style: normal;
  font-size: clamp(7px, 1.7vw, 11px);
  line-height: 1;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
}

.pad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  width: min(92vw, calc(92vh - 200px), 560px);
  margin: 0 auto;
}
.pad-num {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  border-radius: 12px;
  padding: 12px 0;
  font-size: clamp(16px, 4.4vw, 24px);
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s ease, transform 0.05s ease;
  min-height: 44px;
}
.pad-num:hover { background: var(--panel-2); }
.pad-num:active { transform: translateY(1px); }
.pad-erase { color: var(--muted); }

.hint {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

/* 提示条：一句话解释当前提示 */
.hint-bar {
  width: min(92vw, calc(92vh - 200px), 560px);
  margin: 0 auto;
  background: var(--hint-bg);
  border: 1px solid var(--hint-border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.5;
  box-shadow: var(--shadow);
}
.hint-bar[hidden] { display: none; }
.hint-bar.hint-conflict {
  background: var(--conflict-weak);
  border-color: var(--conflict);
  color: var(--conflict);
}

/* 提示高亮：相关格（浅）与主要目标格（强） */
.cell.hint { background: var(--hint-bg); }
.cell.hint-target {
  background: var(--hint-target-bg);
  outline: 2px solid var(--hint-border);
  outline-offset: -2px;
  z-index: 3;
}

.win-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 20, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.win-overlay[hidden] { display: none; }
.win-card {
  background: var(--panel);
  color: var(--text);
  border-radius: 16px;
  padding: 28px 32px;
  text-align: center;
  box-shadow: var(--shadow);
  max-width: 320px;
}
.win-card h2 { margin: 0 0 8px; font-size: 24px; }
.win-card p { margin: 0 0 18px; color: var(--muted); }
.win-best { color: var(--accent); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .cell, .btn, .pad-num { transition: none; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="title">数独</h1>
    <div class="actions">
      <label class="diff">
        难度
        <select id="difficulty" class="select" aria-label="难度选择">
          <option value="easy">简单</option>
          <option value="medium" selected>中等</option>
          <option value="hard">困难</option>
          <option value="expert">专家</option>
        </select>
      </label>
      <span id="timer" class="timer" aria-live="off">00:00</span>
      <button id="btn-new" class="btn" type="button">新局</button>
      <button id="btn-reset" class="btn btn-ghost" type="button">重置</button>
    </div>
  </header>

  <p id="status" class="status" aria-live="polite">生成中…</p>

  <main class="play">
    <div id="board" class="board" role="grid" aria-label="数独棋盘"></div>

    <div id="hint-bar" class="hint-bar" hidden aria-live="polite"></div>

    <div class="toolbar" role="group" aria-label="对局工具">
      <button id="btn-note" class="btn btn-toggle" type="button" aria-pressed="false">笔记</button>
      <button id="btn-autonote" class="btn btn-ghost" type="button">自动候选</button>
      <button id="btn-undo" class="btn btn-ghost" type="button">撤销</button>
      <button id="btn-redo" class="btn btn-ghost" type="button">重做</button>
      <button id="btn-hint" class="btn btn-ghost" type="button">提示</button>
      <button id="btn-pause" class="btn btn-ghost" type="button">暂停</button>
    </div>

    <div id="pad" class="pad" role="group" aria-label="数字盘"></div>
  </main>

  <p class="hint">
    点格或方向键选中，数字键 / 数字盘填数，Backspace 擦除。<br>
    笔记模式（N）下数字键标记候选；给定格不可改；与同行、同列、同宫重复会即时标红（不阻断）。<br>
    撤销 Ctrl/⌘+Z，重做 Ctrl/⌘+Shift+Z，提示 H，暂停 P。
  </p>
</div>

<div id="win" class="win-overlay" hidden>
  <div class="win-card">
    <h2>完成 🎉</h2>
    <p id="win-text">棋盘已填满且唯一解正确。</p>
    <p id="win-best" class="win-best"></p>
    <button id="btn-win-reset" class="btn" type="button">再来一局</button>
  </div>
</div>

<div id="generating" class="gen-overlay" hidden>
  <div class="gen-card">生成中…</div>
</div>

<div id="pause" class="gen-overlay" hidden>
  <div class="gen-card">
    <div class="pause-title">已暂停</div>
    <button id="btn-resume" class="btn" type="button">继续</button>
  </div>
</div>

<div id="resume" class="gen-overlay" hidden>
  <div class="gen-card">
    <div class="resume-title">发现进行中的对局</div>
    <p id="resume-info" class="resume-info"></p>
    <div class="resume-actions">
      <button id="btn-resume-keep" class="btn" type="button">继续上一局</button>
      <button id="btn-resume-new" class="btn btn-ghost" type="button">开新局</button>
    </div>
  </div>
</div>

<script>
'use strict';
/**
 * Sudoku 纯逻辑层（无 DOM、无副作用，可在 node 下被测试）。
 * 同时以 UMD 形式暴露：浏览器挂到 window.SudokuLogic，node 下 module.exports。
 * 该文件会被 build.js 内联进最终单文件 index.html。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SudokuLogic = api;
})(typeof self !== 'undefined' ? self : this, function () {
  const N = 9;
  const CELLS = 81;

  // ---- 索引与坐标 ----
  function idx(r, c) { return r * 9 + c; }
  function rowOf(i) { return (i / 9) | 0; }
  function colOf(i) { return i % 9; }
  function boxOf(i) {
    const r = rowOf(i), c = colOf(i);
    return ((r / 3) | 0) * 3 + ((c / 3) | 0);
  }

  // ---- 预计算 peers / units ----
  // PEERS[i]: 与 i 同行/列/宫的 20 个邻居（不含自身）
  const PEERS = new Array(CELLS);
  for (let i = 0; i < CELLS; i++) {
    const r = rowOf(i), c = colOf(i), b = boxOf(i);
    const set = new Set();
    for (let k = 0; k < 9; k++) { set.add(idx(r, k)); set.add(idx(k, c)); }
    const br = ((b / 3) | 0) * 3, bc = (b % 3) * 3;
    for (let dr = 0; dr < 3; dr++)
      for (let dc = 0; dc < 3; dc++) set.add(idx(br + dr, bc + dc));
    set.delete(i);
    PEERS[i] = Array.from(set);
  }

  // UNITS: 27 个单元（9 行 + 9 列 + 9 宫），每个 9 个索引
  const UNITS = [];
  for (let r = 0; r < 9; r++) { const u = []; for (let c = 0; c < 9; c++) u.push(idx(r, c)); UNITS.push(u); }
  for (let c = 0; c < 9; c++) { const u = []; for (let r = 0; r < 9; r++) u.push(idx(r, c)); UNITS.push(u); }
  for (let b = 0; b < 9; b++) { const u = []; const br = ((b/3)|0)*3, bc = (b%3)*3; for (let dr=0;dr<3;dr++) for (let dc=0;dc<3;dc++) u.push(idx(br+dr, bc+dc)); UNITS.push(u); }

  // ---- 位掩码（数字 d 对应 1<<(d-1)）----
  function bit(d) { return 1 << (d - 1); }
  function digitsToMask(digits) {
    let m = 0;
    for (const d of digits) if (d >= 1 && d <= 9) m |= bit(d);
    return m;
  }
  function maskToDigits(mask) {
    const out = [];
    for (let d = 1; d <= 9; d++) if (mask & bit(d)) out.push(d);
    return out;
  }

  // ---- 冲突检测 ----
  // 返回 Set<index>：与某 peer 同值（同行/列/宫重复）的所有格子。空盘返回空集。
  function findConflicts(values) {
    const conflicts = new Set();
    for (let i = 0; i < CELLS; i++) {
      const v = values[i];
      if (v === 0) continue;
      const peers = PEERS[i];
      for (let k = 0; k < peers.length; k++) {
        if (values[peers[k]] === v) { conflicts.add(i); conflicts.add(peers[k]); break; }
      }
    }
    return conflicts;
  }

  // ---- 完成 / 胜利 ----
  function isComplete(values) {
    for (let i = 0; i < CELLS; i++) if (values[i] === 0) return false;
    return true;
  }
  // 胜利：81 格填满且无冲突（唯一解前提下即正确解）
  function isSolved(values) {
    return isComplete(values) && findConflicts(values).size === 0;
  }

  function cloneValues(values) { return values.slice(); }

  // ---- 候选数推导 ----
  // 返回第 i 格的候选位掩码：同行/列/宫内未出现的数字。已填值格返回 0。
  function computeCandidates(values, i) {
    if (values[i] !== 0) return 0;
    let mask = 0x1FF; // 9 位全置 1
    const peers = PEERS[i];
    for (let k = 0; k < peers.length; k++) {
      const v = values[peers[k]];
      if (v !== 0) mask &= ~bit(v);
    }
    return mask;
  }

  // ---- 选中移动（方向键，边界 clamp）----
  function moveSelection(sel, dir) {
    if (!sel) return sel;
    let r = sel.r, c = sel.c;
    switch (dir) {
      case 'up':    r = Math.max(0, r - 1); break;
      case 'down':  r = Math.min(8, r + 1); break;
      case 'left':  c = Math.max(0, c - 1); break;
      case 'right': c = Math.min(8, c + 1); break;
      default: return sel;
    }
    return { r, c };
  }

  return {
    N, CELLS, idx, rowOf, colOf, boxOf,
    PEERS, UNITS,
    bit, digitsToMask, maskToDigits,
    findConflicts, isComplete, isSolved, cloneValues, moveSelection, computeCandidates,
  };
});

'use strict';
/**
 * 回溯求解器（纯函数，无 DOM、无副作用，可在 node 下被测试）。
 * 依赖 SudokuLogic（node 下 require，浏览器下取 window.SudokuLogic）。
 * 该文件会被 build.js 内联进最终单文件 index.html。
 *
 * 暴露：
 *   solve(values)          -> 返回一组解（数组，0=空）或 null（无解）
 *   countSolutions(values, limit=2) -> 解的数量，数到 limit 即停（仅关心唯一性时用 2）
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = factory(require('./logic.js'));
  } else {
    root.SudokuSolver = factory(root.SudokuLogic);
  }
})(typeof self !== 'undefined' ? self : this, function (Logic) {
  'use strict';

  const N = 81;

  function popcount(m) { let c = 0; while (m) { c += m & 1; m >>>= 1; } return c; }

  // 在 grid（0=空）中，i 格当前能放的数字位掩码（9 位）。
  function candidatesOf(grid, i) {
    let used = 0;
    const peers = Logic.PEERS[i];
    for (let k = 0; k < peers.length; k++) {
      const v = grid[peers[k]];
      if (v !== 0) used |= (1 << (v - 1));
    }
    return (~used) & 0x1FF;
  }

  // 用最小剩余候选（MRV）选空格；返回 {i, mask} 或 null（已填满）；mask=0 表示死路。
  function pickCell(grid) {
    let best = -1, bestMask = 0, bestCount = 10;
    for (let i = 0; i < N; i++) {
      if (grid[i] !== 0) continue;
      const mask = candidatesOf(grid, i);
      const cnt = popcount(mask);
      if (cnt === 0) return { i, mask: 0 };
      if (cnt < bestCount) { bestCount = cnt; best = i; bestMask = mask; if (cnt === 1) break; }
    }
    return best === -1 ? null : { i: best, mask: bestMask };
  }

  // 回溯求解：返回解数组或 null。
  function solve(values) {
    const grid = values.slice();
    function rec() {
      const pick = pickCell(grid);
      if (pick === null) return true;   // 填满即解
      if (pick.mask === 0) return false; // 死路
      const mask = pick.mask;
      for (let d = 1; d <= 9; d++) {
        if (mask & (1 << (d - 1))) {
          grid[pick.i] = d;
          if (rec()) return true;
          grid[pick.i] = 0;
        }
      }
      return false;
    }
    return rec() ? grid : null;
  }

  // 计数解的数量，数到 limit（默认 2）即停。用于唯一性判定。
  function countSolutions(values, limit) {
    if (limit === undefined) limit = 2;
    const grid = values.slice();
    let count = 0;
    function rec() {
      const pick = pickCell(grid);
      if (pick === null) { count++; return; }
      if (pick.mask === 0) return;
      const mask = pick.mask;
      for (let d = 1; d <= 9; d++) {
        if (mask & (1 << (d - 1))) {
          grid[pick.i] = d;
          rec();
          grid[pick.i] = 0;
          if (count >= limit) return;
        }
      }
    }
    rec();
    return count;
  }

  return { solve, countSolutions, _internal: { popcount, candidatesOf } };
});

'use strict';
/**
 * 逻辑技巧分级器（纯函数，无 DOM、无副作用，可在 node 下被测试）。
 * 依赖 SudokuLogic / SudokuSolver。
 * 该文件会被 build.js 内联进最终单文件 index.html。
 *
 * 思路：在玩家/生成盘面（仅 givens）上只使用逻辑技巧推进，记录用到的最高层级；
 * 始终优先应用最低可用层，故最高层是"必需"的，难度标签诚实。
 *
 *   T1 唯一候选（Naked single）
 *   T2 隐藏单（Hidden single）
 *   T3 区块指向/声明（Locked candidates）
 *   T4 数对/三数组（Naked/Hidden pair·triple）
 *   T5 X-Wing
 *
 * grade(puzzle)     -> 用到的最高层级 1..5；无法不猜解开则返回 0（弃题重生成）
 * solveLogically(v) -> { solution, tier } 或 null（需要猜测/卡死）
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = factory(require('./logic.js'), require('./solver.js'));
  } else {
    root.SudokuGrader = factory(root.SudokuLogic, root.SudokuSolver);
  }
})(typeof self !== 'undefined' ? self : this, function (Logic, Solver) {
  'use strict';

  const N = 81;

    if (pauseEl) pauseEl.hidden = !paused;
  }

  function togglePause() {
    if (!state) return;
    setPaused(!state.paused);
  }

  function onKeydown(e) {
    const k = e.key;
    if (!state) return;   // resume 弹窗期间忽略全部键盘输入
    // 暂停/恢复键始终可用
    if (k === 'p' || k === 'P') { togglePause(); e.preventDefault(); return; }
    if (k === 'Escape') { if (state && state.paused) { togglePause(); e.preventDefault(); } return; }
    if (state && state.paused) return; // 暂停时拦截其余输入

    if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) {
      if (e.shiftKey) Game.redo(state); else Game.undo(state);
      render(); e.preventDefault(); return;
    }
    if ((e.ctrlKey || e.metaKey) && (k === 'y' || k === 'Y')) {
      Game.redo(state); render(); e.preventDefault(); return;
    }
    if (k === 'h' || k === 'H') { onHint(); e.preventDefault(); return; }
    if (k === 'n' || k === 'N') { Game.toggleMode(state); render(); e.preventDefault(); return; }

    if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') {
      if (!state.selected) state.selected = { r: 0, c: 0 };
      const dir = k === 'ArrowUp' ? 'up' : k === 'ArrowDown' ? 'down'
                : k === 'ArrowLeft' ? 'left' : 'right';
      state.selected = Logic.moveSelection(state.selected, dir);
      render();
      e.preventDefault();
      return;
    }
    if (k >= '1' && k <= '9') {
      if (state.selected) {
        if (state.mode === 'note') Game.toggleNote(state, state.selected.r, state.selected.c, Number(k));
        else Game.setValue(state, state.selected.r, state.selected.c, Number(k));
        render();
      }
      e.preventDefault();
      return;
    }
    if (k === 'Backspace' || k === 'Delete' || k === '0') {
      if (state.selected) { Game.erase(state, state.selected.r, state.selected.c); render(); }
      e.preventDefault();
    }
  }

  // 新局：先显示「生成中」，让浏览器有机会绘制，再异步生成（避免白屏）。
  function onNewGame() {
    if (!state || state.paused) return;
    const diff = currentDifficulty();
    if (genEl) genEl.hidden = false;
    if (statusEl) statusEl.textContent = '生成中…';
    // 让「生成中」先渲染，再跑同步生成
    setTimeout(() => {
      state = Game.newGame(diff);
      recordedWin = false;
      currentHint = null;
      if (genEl) genEl.hidden = true;
      render();
    }, 0);
  }

  function resetGame() {
    if (!state || state.paused) return;
    // 重置当前谜题（清空玩家填入，保留 givens）
    currentHint = null;
    state = Game.createGame(state.puzzle);
    recordedWin = false;
    render();
  }

  function notesMarkup(mask) {
    let h = '<span class="notes-grid">';
    for (let d = 1; d <= 9; d++) h += '<i>' + ((mask & Logic.bit(d)) ? d : '') + '</i>';
    h += '</span>';
    return h;
  }

  function updateTimer() {
    if (timerEl) timerEl.textContent = Game.formatTime(state ? state.time : 0);
  }

  function render() {
    if (!state) return;
    const sel = state.selected;
    const selIdx = sel ? Logic.idx(sel.r, sel.c) : -1;
    const selVal = selIdx >= 0 ? state.values[selIdx] : 0;
    const selPeers = selIdx >= 0 ? Logic.PEERS[selIdx] : null;

    for (let i = 0; i < 81; i++) {
      const el = cellEls[i];
      const v = state.values[i];

      if (v) {
        el.textContent = String(v);
        el.classList.remove('notes');
      } else if (state.notes[i]) {
        el.textContent = '';
        el.classList.add('notes');
        el.innerHTML = notesMarkup(state.notes[i]);
      } else {
        el.textContent = '';
        el.classList.remove('notes');
        el.innerHTML = '';
      }

      const given = state.givenMask[i] === 1;
      el.classList.toggle('given', given);
      el.classList.toggle('user', v !== 0 && !given);
      el.classList.toggle('selected', i === selIdx);
      el.classList.toggle('conflict', state.conflicts.has(i));
      el.classList.toggle('peer', selPeers ? selPeers.includes(i) : false);
      el.classList.toggle('same', selVal !== 0 && i !== selIdx && v === selVal);
      el.classList.toggle('hint', currentHint ? currentHint.cells.includes(i) : false);
      el.classList.toggle('hint-target', currentHint ? (i === currentHint.target) : false);
    }

    if (winEl) {
      winEl.hidden = state.status !== 'won';
      if (state.status === 'won') {
        const wt = doc.getElementById('win-text');
        if (wt) {
          const lbl = DIFF_LABELS[state.difficulty] || state.difficulty;
          wt.textContent = '棋盘已填满且唯一解正确。难度：' + lbl;
        }
      }
    }

    if (statusEl) {
      const lbl = DIFF_LABELS[state.difficulty] || state.difficulty;
      let t = '难度：' + lbl;
      if (state.grade > 0) t += ' · 技巧层级 T' + state.grade;
      if (state.approximate) t += '（近似）';
      t += ' · 提示数 ' + state.givensCount;
      if (state.hintsUsed) t += ' · 提示 ' + state.hintsUsed + ' 次';
      if (state.mode === 'note') t += ' · 笔记模式';
      statusEl.textContent = t;
    }

    updateTimer();

    if (btnNote) btnNote.setAttribute('aria-pressed', state.mode === 'note' ? 'true' : 'false');
    if (btnUndo) btnUndo.disabled = !Game.canUndo(state);
    if (btnRedo) btnRedo.disabled = !Game.canRedo(state);
    if (btnPause) btnPause.textContent = state.paused ? '继续' : '暂停';

    // 胜利时记录本难度最佳并清存档；进行中每次动作节流写盘（#6）。
    if (state.status === 'won' && !recordedWin) {
      writeBest(state.difficulty, state.time);
      const best = readBest();
      const wb = doc.getElementById('win-best');
      const bestTime = best[state.difficulty] != null ? best[state.difficulty] : state.time;
      if (wb) wb.textContent = '本难度最佳 ' + Game.formatTime(bestTime);
      clearSave();
      recordedWin = true;
    }
    // 提示条：展示当前提示文案（无提示则隐藏）。冲突提示用警示色。
    if (hintBar) {
      if (currentHint) {
        hintBar.hidden = false;
        hintBar.textContent = currentHint.text;
        hintBar.classList.toggle('hint-conflict', currentHint.type === 'conflict');
      } else {
        hintBar.hidden = true;
      }
    }

    scheduleSave();
  }

  return { bootstrap, _getState: () => state, _cellEls: () => cellEls };
});

SudokuUI.bootstrap();
</script>
</body>
</html>
