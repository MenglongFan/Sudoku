<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数独</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5fb;
  --panel: #ffffff;
  --panel-2: #eef0f7;
  --line: #cfd3e0;
  --line-strong: #8a90a6;
  --text: #1c2030;
  --muted: #6b7180;
  --accent: #5b6cff;
  --accent-weak: #e7eaff;
  --given: #1c2030;
  --conflict: #e5484d;
  --peer-bg: #eef1f8;
  --same-bg: #dfe6ff;
  --selected-bg: #c9d2ff;
  --shadow: 0 6px 24px rgba(20, 24, 48, 0.10);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1f2330;
    --line: #2c3140;
    --line-strong: #4b5266;
    --text: #e6e8ef;
    --muted: #9aa0b0;
    --accent: #7c8cff;
    --accent-weak: #232a44;
    --given: #e6e8ef;
    --conflict: #ff6b6f;
    --peer-bg: #1d2230;
    --same-bg: #2a3354;
    --selected-bg: #36406b;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px 12px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.title { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
.actions { display: flex; gap: 8px; }

.btn {
  appearance: none;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
}
.btn:hover { background: var(--panel-2); }
.btn:active { transform: translateY(1px); }

.board {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: min(92vw, calc(92vh - 200px), 560px);
  aspect-ratio: 1 / 1;
  margin: 0 auto;
  background: var(--panel);
  border: 2px solid var(--line-strong);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
  user-select: none;
}

.cell {
  appearance: none;
  margin: 0;
  border: 1px solid var(--line);
  border-top: none;
  border-left: none;
  background: var(--panel);
  color: var(--text);
  font-size: clamp(16px, 4.4vw, 30px);
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  transition: background 0.12s ease, color 0.12s ease;
  font-variant-numeric: tabular-nums;
}
.cell.br { border-right: 2px solid var(--line-strong); }
.cell.bb { border-bottom: 2px solid var(--line-strong); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 2; }

.cell.given { font-weight: 700; color: var(--given); }
.cell.user { color: var(--accent); }

.cell.peer { background: var(--peer-bg); }
.cell.same { background: var(--same-bg); }
.cell.selected { background: var(--selected-bg); }

.cell.conflict { color: var(--conflict); }
.cell.conflict.selected { color: var(--conflict); }

.pad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  width: min(92vw, calc(92vh - 200px), 560px);
  margin: 0 auto;
}
.pad-num {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  border-radius: 12px;
  padding: 12px 0;
  font-size: clamp(16px, 4.4vw, 24px);
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s ease, transform 0.05s ease;
  min-height: 44px;
}
.pad-num:hover { background: var(--panel-2); }
.pad-num:active { transform: translateY(1px); }
.pad-erase { color: var(--muted); }

.hint {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.win-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 20, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.win-overlay[hidden] { display: none; }
.win-card {
  background: var(--panel);
  color: var(--text);
  border-radius: 16px;
  padding: 28px 32px;
  text-align: center;
  box-shadow: var(--shadow);
  max-width: 320px;
}
.win-card h2 { margin: 0 0 8px; font-size: 24px; }
.win-card p { margin: 0 0 18px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .cell, .btn, .pad-num { transition: none; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="title">数独</h1>
    <div class="actions">
      <button id="btn-reset" class="btn" type="button">重置本局</button>
    </div>
  </header>

  <main class="play">
    <div id="board" class="board" role="grid" aria-label="数独棋盘"></div>
    <div id="pad" class="pad" role="group" aria-label="数字盘"></div>
  </main>

  <p class="hint">
    点格或方向键选中，数字键 / 数字盘填数，Backspace 擦除。<br>
    Given 格不可改；与同行、同列、同宫重复会即时标红（不阻断）。填满且无冲突即胜利。
  </p>
</div>

<div id="win" class="win-overlay" hidden>
  <div class="win-card">
    <h2>完成 🎉</h2>
    <p id="win-text">棋盘已填满且无冲突。</p>
    <button id="btn-win-reset" class="btn" type="button">再来一局</button>
  </div>
</div>

<script>
'use strict';
/**
 * Sudoku 纯逻辑层（无 DOM、无副作用，可在 node 下被测试）。
 * 同时以 UMD 形式暴露：浏览器挂到 window.SudokuLogic，node 下 module.exports。
 * 该文件会被 build.js 内联进最终单文件 index.html。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SudokuLogic = api;
})(typeof self !== 'undefined' ? self : this, function () {
  const N = 9;
  const CELLS = 81;

  // ---- 索引与坐标 ----
  function idx(r, c) { return r * 9 + c; }
  function rowOf(i) { return (i / 9) | 0; }
  function colOf(i) { return i % 9; }
  function boxOf(i) {
    const r = rowOf(i), c = colOf(i);
    return ((r / 3) | 0) * 3 + ((c / 3) | 0);
  }

  // ---- 预计算 peers / units ----
  // PEERS[i]: 与 i 同行/列/宫的 20 个邻居（不含自身）
  const PEERS = new Array(CELLS);
  for (let i = 0; i < CELLS; i++) {
    const r = rowOf(i), c = colOf(i), b = boxOf(i);
    const set = new Set();
    for (let k = 0; k < 9; k++) { set.add(idx(r, k)); set.add(idx(k, c)); }
    const br = ((b / 3) | 0) * 3, bc = (b % 3) * 3;
    for (let dr = 0; dr < 3; dr++)
      for (let dc = 0; dc < 3; dc++) set.add(idx(br + dr, bc + dc));
    set.delete(i);
    PEERS[i] = Array.from(set);
  }

  // UNITS: 27 个单元（9 行 + 9 列 + 9 宫），每个 9 个索引
  const UNITS = [];
  for (let r = 0; r < 9; r++) { const u = []; for (let c = 0; c < 9; c++) u.push(idx(r, c)); UNITS.push(u); }
  for (let c = 0; c < 9; c++) { const u = []; for (let r = 0; r < 9; r++) u.push(idx(r, c)); UNITS.push(u); }
  for (let b = 0; b < 9; b++) { const u = []; const br = ((b/3)|0)*3, bc = (b%3)*3; for (let dr=0;dr<3;dr++) for (let dc=0;dc<3;dc++) u.push(idx(br+dr, bc+dc)); UNITS.push(u); }

  // ---- 位掩码（数字 d 对应 1<<(d-1)）----
  function bit(d) { return 1 << (d - 1); }
  function digitsToMask(digits) {
    let m = 0;
    for (const d of digits) if (d >= 1 && d <= 9) m |= bit(d);
    return m;
  }
  function maskToDigits(mask) {
    const out = [];
    for (let d = 1; d <= 9; d++) if (mask & bit(d)) out.push(d);
    return out;
  }

  // ---- 冲突检测 ----
  // 返回 Set<index>：与某 peer 同值（同行/列/宫重复）的所有格子。空盘返回空集。
  function findConflicts(values) {
    const conflicts = new Set();
    for (let i = 0; i < CELLS; i++) {
      const v = values[i];
      if (v === 0) continue;
      const peers = PEERS[i];
      for (let k = 0; k < peers.length; k++) {
        if (values[peers[k]] === v) { conflicts.add(i); conflicts.add(peers[k]); break; }
      }
    }
    return conflicts;
  }

  // ---- 完成 / 胜利 ----
  function isComplete(values) {
    for (let i = 0; i < CELLS; i++) if (values[i] === 0) return false;
    return true;
  }
  // 胜利：81 格填满且无冲突（唯一解前提下即正确解）
  function isSolved(values) {
    return isComplete(values) && findConflicts(values).size === 0;
  }

  function cloneValues(values) { return values.slice(); }

  // ---- 选中移动（方向键，边界 clamp）----
  function moveSelection(sel, dir) {
    if (!sel) return sel;
    let r = sel.r, c = sel.c;
    switch (dir) {
      case 'up':    r = Math.max(0, r - 1); break;
      case 'down':  r = Math.min(8, r + 1); break;
      case 'left':  c = Math.max(0, c - 1); break;
      case 'right': c = Math.min(8, c + 1); break;
      default: return sel;
    }
    return { r, c };
  }

  return {
    N, CELLS, idx, rowOf, colOf, boxOf,
    PEERS, UNITS,
    bit, digitsToMask, maskToDigits,
    findConflicts, isComplete, isSolved, cloneValues, moveSelection,
  };
});

'use strict';
/**
 * 对局状态机（GameState + Controller 的纯逻辑部分，无 DOM）。
 * 依赖 SudokuLogic（node 下 require，浏览器下取 window.SudokuLogic）。
 * 该文件会被 build.js 内联进最终单文件 index.html。
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = factory(require('./logic.js'));
  } else {
    root.SudokuGame = factory(root.SudokuLogic);
  }
})(typeof self !== 'undefined' ? self : this, function (Logic) {
  'use strict';

  // puzzle: { givens: number[] (0=空,1..9), solution?: number[] }
  function createGame(puzzle) {
    const givens = Array.from(puzzle.givens);
    const solution = puzzle.solution ? Array.from(puzzle.solution) : null;
    const values = givens.slice();                 // 初始 = 给定（clues 预填）
    const givenMask = givens.map(v => (v !== 0 ? 1 : 0));
    const state = {
      puzzle, givens, solution, values, givenMask,
      selected: null,                              // {r,c}
      status: 'playing',                           // 'playing' | 'won'
      conflicts: new Set(),
    };
    recompute(state);
    return state;
  }

  function select(state, r, c) {
    if (r < 0 || r > 8 || c < 0 || c > 8) return state;
    state.selected = { r, c };
    return state;
  }

  // 填数 d（1..9）。Given 格或非法 d 返回 false 且不改动；成功返回 true。
  function setValue(state, r, c, d) {
    const i = Logic.idx(r, c);
    if (state.givenMask[i]) return false;          // Given 锁
    if (!Number.isInteger(d) || d < 1 || d > 9) return false;
    state.values[i] = d;
    state.selected = { r, c };
    recompute(state);
    return true;
  }

  // 擦除。Given 格返回 false。
  function erase(state, r, c) {
    const i = Logic.idx(r, c);
    if (state.givenMask[i]) return false;
    state.values[i] = 0;
    recompute(state);
    return true;
  }

  // 根据当前 values 重算冲突与胜利状态。
  function recompute(state) {
    state.conflicts = Logic.findConflicts(state.values);
    state.status = Logic.isSolved(state.values) ? 'won' : 'playing';
    return state;
  }

  return { createGame, select, setValue, erase, recompute };
});

'use strict';
/**
 * UI 层 + 控制器事件绑定（依赖 SudokuLogic / SudokuGame）。
 * node 下（烟雾测试）通过 global 注入 document/window；浏览器下取 window。
 * 该文件会被 build.js 内联进最终单文件 index.html。
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = factory(require('./logic.js'), require('./game.js'), global);
  } else {
    root.SudokuUI = factory(root.SudokuLogic, root.SudokuGame, root);
  }
})(typeof self !== 'undefined' ? self : this, function (Logic, Game, docRoot) {
  'use strict';

  // #1 硬编码谜题（Wikipedia 经典样例，唯一解）—— 后续切片替换为生成器
  const PUZZLE = {
    givens: [
      5,3,0, 0,7,0, 0,0,0,
      6,0,0, 1,9,5, 0,0,0,
      0,9,8, 0,0,0, 0,6,0,
      8,0,0, 0,6,0, 0,0,3,
      4,0,0, 8,0,3, 0,0,1,
      7,0,0, 0,2,0, 0,0,6,
      0,6,0, 0,0,0, 2,8,0,
      0,0,0, 4,1,9, 0,0,5,
      0,0,0, 0,8,0, 0,7,9,
    ],
    solution: [
      5,3,4,6,7,8,9,1,2,
      6,7,2,1,9,5,3,4,8,
      1,9,8,3,4,2,5,6,7,
      8,5,9,7,6,1,4,2,3,
      4,2,6,8,5,3,7,9,1,
      7,1,3,9,2,4,8,5,6,
      9,6,1,5,3,7,2,8,4,
      2,8,7,4,1,9,6,3,5,
      3,4,5,2,8,6,1,7,9,
    ],
  };

  let state = null;
  let cellEls = [];
  let doc = null;
  let boardEl = null;
  let winEl = null;

  function bootstrap() {
    doc = docRoot.document;
    boardEl = doc.getElementById('board');
    winEl = doc.getElementById('win');
    state = Game.createGame(PUZZLE);

    buildBoard();
    buildPad();
    wireToolbar();
    wireKeyboard();
    render();
  }

  function buildBoard() {
    boardEl.textContent = '';
    cellEls = new Array(81);
    for (let i = 0; i < 81; i++) {
      const r = Logic.rowOf(i), c = Logic.colOf(i);
      const el = doc.createElement('button');
      el.type = 'button';
      el.className = 'cell';
      el.dataset.idx = String(i);
      el.dataset.r = String(r);
      el.dataset.c = String(c);
      if (c % 3 === 2 && c !== 8) el.classList.add('br'); // 宫右粗线
      if (r % 3 === 2 && r !== 8) el.classList.add('bb'); // 宫下粗线
      el.setAttribute('aria-label', '行' + (r + 1) + '列' + (c + 1));
      el.addEventListener('click', onCellClick);
      cellEls[i] = el;
      boardEl.appendChild(el);
    }
  }

  function buildPad() {
    const pad = doc.getElementById('pad');
    pad.textContent = '';
    for (let d = 1; d <= 9; d++) {
      const b = doc.createElement('button');
      b.type = 'button';
      b.className = 'pad-num';
      b.textContent = String(d);
      b.dataset.d = String(d);
      b.addEventListener('click', onPadClick);
      pad.appendChild(b);
    }
    const er = doc.createElement('button');
    er.type = 'button';
    er.className = 'pad-num pad-erase';
    er.textContent = '⌫';
    er.setAttribute('aria-label', '擦除');
    er.addEventListener('click', onEraseClick);
    pad.appendChild(er);
  }

  function wireToolbar() {
    const reset = doc.getElementById('btn-reset');
    if (reset) reset.addEventListener('click', resetGame);
    const winReset = doc.getElementById('btn-win-reset');
    if (winReset) winReset.addEventListener('click', resetGame);
  }

  function wireKeyboard() {
    docRoot.addEventListener('keydown', onKeydown);
  }

  function onCellClick(e) {
    const t = e.currentTarget;
    Game.select(state, Number(t.dataset.r), Number(t.dataset.c));
    render();
  }

  function onPadClick(e) {
    if (!state.selected) return;
    const d = Number(e.currentTarget.dataset.d);
    Game.setValue(state, state.selected.r, state.selected.c, d);
    render();
  }

  function onEraseClick() {
    if (!state.selected) return;
    Game.erase(state, state.selected.r, state.selected.c);
    render();
  }

  function onKeydown(e) {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') {
      if (!state.selected) state.selected = { r: 0, c: 0 };
      const dir = k === 'ArrowUp' ? 'up' : k === 'ArrowDown' ? 'down'
                : k === 'ArrowLeft' ? 'left' : 'right';
      state.selected = Logic.moveSelection(state.selected, dir);
      render();
      e.preventDefault();
      return;
    }
    if (k >= '1' && k <= '9') {
      if (state.selected) { Game.setValue(state, state.selected.r, state.selected.c, Number(k)); render(); }
      e.preventDefault();
      return;
    }
    if (k === 'Backspace' || k === 'Delete' || k === '0') {
      if (state.selected) { Game.erase(state, state.selected.r, state.selected.c); render(); }
      e.preventDefault();
    }
  }

  function resetGame() {
    state = Game.createGame(PUZZLE);
    render();
  }

  function render() {
    const sel = state.selected;
    const selIdx = sel ? Logic.idx(sel.r, sel.c) : -1;
    const selVal = selIdx >= 0 ? state.values[selIdx] : 0;
    const selPeers = selIdx >= 0 ? Logic.PEERS[selIdx] : null;

    for (let i = 0; i < 81; i++) {
      const el = cellEls[i];
      const v = state.values[i];
      el.textContent = v ? String(v) : '';

      const given = state.givenMask[i] === 1;
      el.classList.toggle('given', given);
      el.classList.toggle('user', v !== 0 && !given);
      el.classList.toggle('selected', i === selIdx);
      el.classList.toggle('conflict', state.conflicts.has(i));
      el.classList.toggle('peer', selPeers ? selPeers.includes(i) : false);
      el.classList.toggle('same', selVal !== 0 && i !== selIdx && v === selVal);
    }

    if (winEl) winEl.hidden = state.status !== 'won';
  }

  return { bootstrap, _getState: () => state, _cellEls: () => cellEls };
});

SudokuUI.bootstrap();
</script>
</body>
</html>
